name: CI

on:
  # PR ブランチで二重に走らないよう、push は既定ブランチだけにする
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 既定ブランチの実行は取り消さず、PR の古い実行だけを取り消す
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm のバージョンは package.json の packageManager から読まれる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # packages/editor と apps/web のテストは headless の Chromium の中で動かす。headless では
      # headless shell しか使わないので、それだけを入れる。
      # ブラウザは editor の playwright の版で入れるので、apps/web の playwright は editor と
      # 同じ版に固定する（片方だけ上げると、web のテストが自分の版のブラウザを見つけられない）。
      # @codemirror/* も editor と web で同じ版にする（版が割れると @codemirror/state が 2 つ
      # 読み込まれ、web から渡した extension を editor の view が受け付けない）
      - id: playwright
        run: echo "version=$(pnpm --filter @personal-wiki/editor exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # cache が当たってもブラウザが使う OS のライブラリは入れ直す必要があるので、毎回実行する。
      # ブラウザ本体は入っていればダウンロードを飛ばす
      - run: pnpm --filter @personal-wiki/editor exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
