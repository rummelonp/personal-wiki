name: CI

on:
  # PR ブランチで二重に走らないよう、push は既定ブランチだけにする
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 既定ブランチの実行は取り消さず、PR の古い実行だけを取り消す
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm のバージョンは package.json の packageManager から読まれる
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # packages/editor のテストは headless の Chromium の中で動かす。headless では
      # headless shell しか使わないので、それだけを入れる
      - id: playwright
        run: echo "version=$(pnpm --filter @personal-wiki/editor exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # cache が当たってもブラウザが使う OS のライブラリは入れ直す必要があるので、毎回実行する。
      # ブラウザ本体は入っていればダウンロードを飛ばす
      - run: pnpm --filter @personal-wiki/editor exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
