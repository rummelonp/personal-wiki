name: E2E

# 手で起動する（gh workflow run e2e.yml -R rummelonp/personal-wiki）。
# workflow_dispatch は、既定ブランチにこのファイルがあるときだけ起動できる。
# 既定ブランチにあれば、--ref <ブランチ> で push した作業ブランチの版も流せる。
# 速さの計測（perf-* の project）は、予算が 1 台の機械の値なので手元の pnpm e2e:full だけで流す。
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "絞り込む spec のパスや正規表現（空白区切り。空なら全部）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # Linux では流せない。Linux の WebKit は http://localhost の Secure の cookie を送らず、owner の
    # テストがすべて匿名になる。theme.css の font stack が先頭に置く Hiragino も macOS にしか無く、
    # 文字の幅や折り返しを測るテストが手元と合わない
    runs-on: macos-latest
    # macos-latest（3 vCPU）で 5 つの project を流すと 18 分ほどかかる。詰まったときに
    # 待ち続けないよう、倍より長めの値で打ち切る
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm のバージョンは package.json の packageManager から読まれる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @personal-wiki/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-e2e-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # ブラウザ本体は入っていればダウンロードを飛ばす
      - run: pnpm --filter @personal-wiki/web exec playwright install chromium webkit firefox
      # Playwright には project を除く指定が無いので、apps/web/playwright.config.ts の perf-* 以外を
      # 並べる。project を足したらここにも足す。
      # specs は env 経由で渡し、シェルの構文としては解釈させない（空白で分けるだけで、glob は展開しない）。
      # Playwright は -- の後の引数を絞り込みに使わないので、-- で option と分けることはできない
      - name: Run E2E
        env:
          E2E_SPECS: ${{ inputs.specs }}
        run: |
          set -f
          pnpm --filter @personal-wiki/web exec playwright test \
            --project=chromium-desktop \
            --project=webkit-iphone \
            --project=firefox-desktop \
            --project=chromium-android \
            --project=webkit-desktop \
            $E2E_SPECS
      # 失敗したときの trace とスクリーンショットを後から見られるよう、失敗しても上げる。
      # timeout-minutes の打ち切りは取り消しとして扱われ、!cancelled() では上がらないので always() にする
      # （詰まったときこそ trace が要る）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: e2e-output
          path: apps/web/e2e-output/
          retention-days: 14
          if-no-files-found: warn
